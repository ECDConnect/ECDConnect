query removalDetailsForPractitioners($userIds: [String]) {
  removalDetailsForPractitioners(userIds: $userIds) {
    dateOfRemoval
    id
    userId
    reasonDetails
    reasonForPractitionerLeavingProgrammeId
    removedByUserId
    classReassignments {
      id
      reassignedClass
      reassignedToPractitioner
    }
  }
}
