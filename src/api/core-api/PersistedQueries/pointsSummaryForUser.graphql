query pointsSummaryForUser($userId: String, $startDate: DateTime!, $endDate: DateTime!) {
  pointsSummaryForUser(userId: $userId, startDate: $startDate, endDate: $endDate) {
    pointsTotal
    pointsYTD
    timesScored
    month
    year
    userId
    dateScored
    pointsActivity {
      id
      name
      points
      maxPointsIndividualMonthly
      maxPointsIndividualYearly
    }
  }
}
