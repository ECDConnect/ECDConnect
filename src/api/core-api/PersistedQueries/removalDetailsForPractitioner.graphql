query removalDetailsForPractitioner($userId: String) {
  removalDetailsForPractitioner(userId: $userId) {
    dateOfRemoval
    id
    reasonDetails
    reasonForPractitionerLeavingProgrammeId
    removedByUserId
    classReassignments {
      id
      reassignedClass
      reassignedToPractitioner
    }
  }
}
