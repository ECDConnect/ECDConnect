# Superseded by SaveCertificateDetails - kept so already-deployed app versions keep working.
mutation SaveHealthCertificateDetails($visitId: UUID!, $certificateName: String!, $certificateRegNr: String!) {
  saveHealthCertificateDetails: saveCertificateDetails(visitId: $visitId, certificateName: $certificateName, certificateRegNr: $certificateRegNr)
}
