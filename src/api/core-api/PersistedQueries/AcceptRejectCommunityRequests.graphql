mutation AcceptRejectCommunityRequests($input: AcceptRejectCommunityRequestsInputModelInput) {
  acceptRejectCommunityRequests(input: $input) {
    id
    userId
    aboutShort
    aboutLong
    shareContactInfo
    shareEmail
    sharePhoneNumber
    shareProfilePhoto
    shareProvince
    provinceId
    provinceName
    shareRole
    clickedECDHeros
    coachUserId
    coachName
    completenessPerc
    completenessPercColor
    completenessPercImage
    insertedDate
    profileSkills {
      id
      name
      imageName
      description
      isActive
      ordering
    }
    communityUser {
      id
      fullName
      email
      phoneNumber
      whatsAppNumber
      profilePhoto
      roleName
    }
    acceptedConnections {
      id
      userId
      aboutShort
      aboutLong
      shareEmail
      sharePhoneNumber
      shareProfilePhoto
      shareProvince
      provinceId
      provinceName
      shareRole
      communityUser {
        id
        fullName
        email
        phoneNumber
        whatsAppNumber
        profilePhoto
        roleName
      }
    }
    pendingConnections {
      id
      userId
      aboutShort
      aboutLong
      shareEmail
      sharePhoneNumber
      shareProfilePhoto
      shareProvince
      provinceId
      provinceName
      shareRole
      communityUser {
        id
        fullName
        email
        phoneNumber
        whatsAppNumber
        profilePhoto
        roleName
      }
    }
    userConnectionRequests {
      id
      userId
      aboutShort
      aboutLong
      shareEmail
      sharePhoneNumber
      shareProfilePhoto
      shareProvince
      provinceId
      provinceName
      shareRole
      connectionAccepted
      communityUser {
        id
        fullName
        email
        phoneNumber
        whatsAppNumber
        profilePhoto
        roleName
      }
    }
  }
}
