query allClassroomsForCoach {
  allClassroomsForCoach {
    id
    userId
    name
    classroomImageUrl
    childProgressReportPeriods {
      id
      startDate
      endDate
    }
    siteAddress {
      id
      name
      addressLine1
      addressLine2
      addressLine3
      postalCode
      ward
    }
  }
}
