query allCaregiver {
  allCaregiver {
    id
    phoneNumber
    idNumber
    firstName
    surname
    fullName
    siteAddressId
    siteAddress {
      id
      provinceId
      province {
        id
        description
      }
      name
      addressLine1
      addressLine2
      addressLine3
      postalCode
      ward
      isActive
    }
    relationId
    educationId
    emergencyContactFirstName
    emergencyContactSurname
    emergencyContactPhoneNumber
    additionalFirstName
    additionalSurname
    additionalPhoneNumber
    joinReferencePanel
    contribution
    grants {
      id
      description
    }
    isActive
    isAllowedCustody
  }
}
