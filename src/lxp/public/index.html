<body class="font-body">
  <div id="root"></div>
  <script>
  var $buoop = {
    api: 2026.02,
    required: { c:-5, f:-5, s:-3 },  
    insecure: true,
    unsupported: true,
    reminder: 0,                
    newwindow: true,
    nomessage: true,         
    onshow: function(infos) {   
      console.log('browser-update.org onshow triggered!', infos);  
      window.dispatchEvent(new CustomEvent('browser-outdated', { detail: infos }));
    }
  };

  function $buo_f() {
    console.log('Loading browser-update.org script...');
    var e = document.createElement("script");
    e.src = "//browser-update.org/update.min.js";
    document.body.appendChild(e);
  }

  try {
    document.addEventListener("DOMContentLoaded", $buo_f, false);
  } catch (e) {
    window.attachEvent("onload", $buo_f);
  }
</script>
