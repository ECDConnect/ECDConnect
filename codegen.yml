overwrite: true
schema:
  'http://localhost:5000/graphql?sdl':
    handleAsSDL: true
debug: true
verbose: true
generates:
  packages/graphql/src/graphql/generatedGraphql.tsx:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-react-apollo'
    config:
      withHooks: true
